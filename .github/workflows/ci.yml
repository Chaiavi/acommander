name: Build and Test

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # ffmpeg.exe (~110 MB download); fetchFfmpeg skips the download when this holds the pinned build
      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: apps/media
          key: ffmpeg-${{ hashFiles('build.gradle') }}
          restore-keys: ffmpeg-
      - name: Build and test
        run: ./gradlew build
