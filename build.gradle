buildscript {
    ext {
        appVersion = '4.5'
        shadowPluginVersion = '9.3.1'
        launch4jPluginVersion = '4.0.0'

        javafxVersion = '21.0.7'
        lombokVersion = '1.18.42'
        logbackVersion = '1.5.29'
        slf4jVersion = '2.0.17'
        jacksonVersion = '2.17.2'
        junitBomVersion = '5.11.4'
        assertjVersion = '3.27.7'
        mockitoVersion = '5.14.2'
    }
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.gradleup.shadow:shadow-gradle-plugin:${shadowPluginVersion}"
        classpath "edu.sc.seis.launch4j:launch4j:${launch4jPluginVersion}"
    }
}

apply plugin: 'application'
apply plugin: 'com.gradleup.shadow'
apply plugin: 'edu.sc.seis.launch4j'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"
    implementation "ch.qos.logback:logback-core:${logbackVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "org.openjfx:javafx-base:${javafxVersion}:win"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:win"
    implementation "org.openjfx:javafx-controls:${javafxVersion}:win"
    implementation "org.openjfx:javafx-fxml:${javafxVersion}:win"
    testImplementation platform("org.junit:junit-bom:${junitBomVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
}

application {
    mainClass = 'org.chaiware.acommander.Launcher'
}

// appVersion is the only place the version is written; the app reads it from app-version.properties.
def appVersionValue = appVersion
tasks.named('processResources') {
    inputs.property('appVersion', appVersionValue)
    filesMatching('app-version.properties') {
        expand(appVersion: appVersionValue)
    }
}

shadowJar {
    archiveBaseName = 'acommander'
    archiveClassifier = ''
    archiveVersion = ''
}

// Disable the problematic distribution tasks
tasks.named('shadowDistZip') { enabled = false }
tasks.named('shadowDistTar') { enabled = false }
tasks.named('startShadowScripts') { enabled = false }

// Configure clean task to also delete dist folder and ZIP file
tasks.named('clean') {
    delete 'dist'
    delete fileTree('.') {
        include 'acommander-v*.zip'
    }
}

// UniExtract rewrites its ini on every run, so git tracks only the default template
def uniExtractIni = file('apps/extract_all/UniExtract/UniExtract.ini')
def seedUniExtractIni = tasks.register('seedUniExtractIni', Copy) {
    onlyIf { !uniExtractIni.exists() }
    from('apps/extract_all/UniExtract') {
        include 'UniExtract.default.ini'
        rename { 'UniExtract.ini' }
    }
    into 'apps/extract_all/UniExtract'
}

// What a release ships from config/ and apps/. Tools write logs and settings into their folders, and
// config/acommander.properties holds the user's paths, bookmarks and FTP logins: none of that ships.
def releaseConfigFiles = ['apps.json']
def releaseAppsExcludes = [
        '**/*.log',
        'copy/Log/**',
        'copy/FastCopy2.ini',
        'extract_all/UniExtract/UniExtract.ini',
        'extract_all/UniExtract/batch.queue',
        'extract_all/UniExtract/log/**',
]
def releaseResources = copySpec {
    from('config') {
        include releaseConfigFiles
        into 'config'
    }
    from('apps') {
        exclude releaseAppsExcludes
        into 'apps'
    }
    // A fresh UniExtract.ini from the template, not the one UniExtract rewrote on this machine
    from('apps/extract_all/UniExtract/UniExtract.default.ini') {
        rename { 'UniExtract.ini' }
        into 'apps/extract_all/UniExtract'
    }
}

// Task to copy config and apps folders to build/libs
def copyResources = tasks.register('copyResources', Copy) {
    with releaseResources
    into layout.buildDirectory.dir('libs')
}

// Launch4j configuration - simplified
launch4j {
    mainClassName = 'org.chaiware.acommander.Launcher'
    classpath = ['acommander.jar']
    bundledJrePath = 'runtime'
    icon = "${projectDir}/acommander.ico"
    outfile = 'acommander.exe'
    jarTask = project.tasks.shadowJar
    headerType = "gui"
    copyConfigurable = []

    // Version info using the variable
    version = appVersion
    textVersion = appVersion
    copyright = 'Chaiware.org'
    companyName = 'Chaiware.org'
    fileDescription = 'ACommander - NC Clone'
    productName = 'ACommander'

    // JVM options
    jvmOptions = ['--enable-native-access=javafx.graphics']
}

def copyRuntime = tasks.register('copyRuntime', Sync) {
    def runtimeHome = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }.map { it.metadata.installationPath.asFile }
    from(runtimeHome)
    into(layout.buildDirectory.dir('runtime'))
}

// Built from the sources, never from dist/ or build/libs, where a run of the app leaves its own settings and logs
def distributionContents = copySpec {
    from(layout.buildDirectory.dir('launch4j')) {  // Default location for launch4j output
        include '*.exe'
    }
    from(tasks.named('shadowJar'))
    with releaseResources
    from(copyRuntime) {
        into 'runtime'
    }
}

// Mirrors the release into dist/ at the project root; a Sync, so files from older builds don't linger
def copyDist = tasks.register('copyDist', Sync) {
    dependsOn tasks.named('createExe')
    with distributionContents
    into 'dist'
    preserve { include 'acommander-v*.zip' }
}

def zipDist = tasks.register('zipDist', Zip) {
    dependsOn tasks.named('createExe')
    mustRunAfter copyDist
    with distributionContents
    archiveFileName = "acommander-v${appVersion}.zip"
    destinationDirectory = file('dist')
}

// Fails the release if the ZIP holds per-user files or lacks what the app needs to start
def verifyDistribution = tasks.register('verifyDistribution') {
    def zipFile = zipDist.flatMap { it.archiveFile }
    def uniExtractTemplate = file('apps/extract_all/UniExtract/UniExtract.default.ini')
    def allowedConfig = releaseConfigFiles.collect { 'config/' + it }
    inputs.file(zipFile)
    inputs.file(uniExtractTemplate)
    doLast {
        def zip = new java.util.zip.ZipFile(zipFile.get().asFile)
        try {
            def names = Collections.list(zip.entries()).collect { it.name }
            def privateEntries = names.findAll { name ->
                (name.startsWith('config/') && name != 'config/' && !allowedConfig.contains(name)) ||
                        name.toLowerCase().endsWith('.log') ||
                        name.contains('acommander.properties') ||
                        name.startsWith('apps/copy/Log/') ||
                        name == 'apps/copy/FastCopy2.ini' ||
                        name == 'apps/extract_all/UniExtract/batch.queue' ||
                        name.startsWith('apps/extract_all/UniExtract/log/')
            }
            def required = ['acommander.exe', 'acommander.jar', 'runtime/bin/javaw.exe',
                            'apps/extract_all/UniExtract/UniExtract.ini'] + allowedConfig
            def missing = required.findAll { !names.contains(it) }
            def problems = []
            if (privateEntries) problems << "per-user files: ${privateEntries.take(20)}"
            if (missing) problems << "missing files: ${missing}"
            def ini = zip.getEntry('apps/extract_all/UniExtract/UniExtract.ini')
            if (ini != null && zip.getInputStream(ini).bytes != uniExtractTemplate.bytes) {
                problems << 'UniExtract.ini is not UniExtract.default.ini'
            }
            if (problems) {
                throw new GradleException("${zipFile.get().asFile.name}: ${problems.join('; ')}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('dist') {
    dependsOn copyDist, zipDist, verifyDistribution
    group = 'distribution'
    description = 'Creates the dist folder and a verified distribution ZIP'
}

// Fix task dependencies
tasks.named('shadowJar') { finalizedBy copyResources }
tasks.named('createExe') {
    dependsOn tasks.named('shadowJar')
    mustRunAfter copyResources
}
tasks.named('startScripts') {
    dependsOn tasks.named('shadowJar')
    dependsOn copyResources
}

tasks.named('test') {
    useJUnitPlatform()
    // Tests read these directly; without them a docs- or apps.json-only edit leaves `test` up-to-date (a false green).
    inputs.files('config/apps.json', 'README.md', 'docs/CODEMAP.md')
    inputs.dir('src/main/java')
    systemProperty 'acommander.appVersion', appVersionValue
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

// IntelliJ injects temporary debugger init scripts (ijJvmDebugger*.gradle) for Gradle `run`.
// Those scripts can conflict with Gradle configuration-cache deserialization across runs.
tasks.named('run') {
    dependsOn seedUniExtractIni
    notCompatibleWithConfigurationCache('Avoid IntelliJ debugger init-script classloader cache mismatch')
}
