buildscript {
    ext {
        shadowPluginVersion = '9.6.1'
        launch4jPluginVersion = '4.0.0'

        javafxVersion = '21.0.12'
        lombokVersion = '1.18.48'
        logbackVersion = '1.6.5'
        slf4jVersion = '2.0.20'
        jacksonVersion = '2.22.3'
        junitBomVersion = '6.1.3'
        assertjVersion = '3.27.7'
        mockitoVersion = '5.24.0'
    }
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.gradleup.shadow:shadow-gradle-plugin:${shadowPluginVersion}"
        classpath "edu.sc.seis.launch4j:launch4j:${launch4jPluginVersion}"
    }
}

apply plugin: 'application'
apply plugin: 'com.gradleup.shadow'
apply plugin: 'edu.sc.seis.launch4j'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"
    implementation "ch.qos.logback:logback-core:${logbackVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "org.openjfx:javafx-base:${javafxVersion}:win"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:win"
    implementation "org.openjfx:javafx-controls:${javafxVersion}:win"
    implementation "org.openjfx:javafx-fxml:${javafxVersion}:win"
    testImplementation platform("org.junit:junit-bom:${junitBomVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
}

application {
    mainClass = 'org.chaiware.acommander.Launcher'
}

// The version is written only in app-version.properties, so IDE launches (which skip Gradle) read it too.
def versionProperties = new Properties()
file('src/main/resources/app-version.properties').withInputStream { versionProperties.load(it) }
ext.appVersion = versionProperties.getProperty('version').trim()
def appVersionValue = appVersion

shadowJar {
    archiveBaseName = 'acommander'
    archiveClassifier = ''
    archiveVersion = ''
}
// Otherwise the plain jar writes acommander.jar too, and createExe may pick up either
tasks.named('jar') { archiveClassifier = 'plain' }

// Disable the problematic distribution tasks
tasks.named('shadowDistZip') { enabled = false }
tasks.named('shadowDistTar') { enabled = false }
tasks.named('startShadowScripts') { enabled = false }

// Configure clean task to also delete dist folder and ZIP file
tasks.named('clean') {
    delete 'dist'
    delete fileTree('.') {
        include 'acommander-v*.zip'
    }
}

// These tools rewrite their settings file on every run, so git tracks only a default template (path under apps/)
def toolSettingsTemplates = [
        'extract_all/UniExtract/UniExtract.ini': 'extract_all/UniExtract/UniExtract.default.ini',
        'multi_rename/Renamer.xml'             : 'multi_rename/Renamer.default.xml',
]
def toolSettingsFiles = toolSettingsTemplates.collectEntries { live, template ->
    [(file("apps/${live}")): file("apps/${template}")]
}
def seedToolSettings = tasks.register('seedToolSettings') {
    doLast {
        toolSettingsFiles.each { File live, File template ->
            if (!live.exists()) java.nio.file.Files.copy(template.toPath(), live.toPath())
        }
    }
}

// ffmpeg.exe (gyan.dev essentials, GPLv3) is over GitHub's 100 MB file limit, so the build downloads it, pinned by hash.
// Its version and the release Tool Updates downloads it from are in config/apps.json (tools, id ffmpeg).
def ffmpegTool = new groovy.json.JsonSlurper().parse(file('config/apps.json')).tools.find { it.id == 'ffmpeg' }
def ffmpegVersion = ffmpegTool.version as String
def ffmpegRelease = ffmpegTool.release as String
def ffmpegZipSha256 = '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'
def ffmpegExe = file('apps/media/ffmpeg.exe')
def ffmpegLicense = file('apps/media/LICENSE.txt')
// Holds the zip hash of the files beside it, so a fresh checkout with a restored apps/media (CI cache) skips the download
def ffmpegSource = file('apps/media/source.sha256')
def fetchFfmpeg = tasks.register('fetchFfmpeg') {
    def url = "https://github.com/GyanD/codexffmpeg/releases/download/${ffmpegVersion}/ffmpeg-${ffmpegVersion}-essentials_build.zip"
    inputs.property('sha256', ffmpegZipSha256)
    outputs.files(ffmpegExe, ffmpegLicense, ffmpegSource)
    onlyIf {
        !(ffmpegExe.isFile() && ffmpegLicense.isFile() && ffmpegSource.isFile() && ffmpegSource.text.trim() == ffmpegZipSha256)
    }
    doLast {
        def zipFile = File.createTempFile('ffmpeg-', '.zip')
        try {
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            URI.create(url).toURL().withInputStream { input ->
                zipFile.withOutputStream { output ->
                    input.eachByte(1 << 16) { byte[] buffer, int length ->
                        digest.update(buffer, 0, length)
                        output.write(buffer, 0, length)
                    }
                }
            }
            def actual = digest.digest().encodeHex().toString()
            if (actual != ffmpegZipSha256) {
                throw new GradleException("${url}: SHA-256 is ${actual}, expected ${ffmpegZipSha256}")
            }
            ffmpegExe.parentFile.mkdirs()
            def zip = new java.util.zip.ZipFile(zipFile)
            try {
                [(ffmpegExe): '/bin/ffmpeg.exe', (ffmpegLicense): '/LICENSE'].each { File target, String suffix ->
                    def entry = zip.entries().find { it.name.endsWith(suffix) && it.name.count('/') == suffix.count('/') }
                    if (entry == null) throw new GradleException("${url} has no ${suffix}")
                    target.withOutputStream { it << zip.getInputStream(entry) }
                }
            } finally {
                zip.close()
            }
            ffmpegSource.text = ffmpegZipSha256
        } finally {
            zipFile.delete()
        }
    }
}

// What a release ships from config/ and apps/. Tools write logs and settings into their folders, and
// config/acommander.properties holds the user's paths, bookmarks and FTP logins: none of that ships.
def releaseConfigFiles = ['apps.json']
def releaseAppsExcludes = [
        '**/*.log',
        'copy/Log/**',
        'copy/FastCopy2.ini',
        'extract_all/UniExtract/batch.queue',
        'extract_all/UniExtract/log/**',
        'media/source.sha256',
        // Left by Tool Updates while the replaced exe still runs
        '**/*.acommander-old',
        'tools.sha256.tmp',
]
def releaseResources = copySpec {
    from('config') {
        include releaseConfigFiles
        into 'config'
    }
    from('apps') {
        exclude releaseAppsExcludes + toolSettingsTemplates.keySet()
        into 'apps'
    }
    // Fresh settings from the templates, not the ones the tools rewrote on this machine
    toolSettingsTemplates.each { live, template ->
        from("apps/${template}") {
            rename { live.tokenize('/').last() }
            into "apps/${live.substring(0, live.lastIndexOf('/'))}"
        }
    }
}

// SHA-256 of every shipped file under apps/. Tool Updates compares a user's copy of this list with main's copy and
// downloads the files main changed; commit it with the tool files.
def toolHashesFile = file('apps/tools.sha256')
def toolFiles = fileTree('apps') {
    exclude releaseAppsExcludes + toolSettingsTemplates.keySet() + ['tools.sha256']
}
def toolHashes = tasks.register('toolHashes') {
    dependsOn fetchFfmpeg
    inputs.files(toolFiles)
    outputs.file(toolHashesFile)
    doLast {
        def hashes = new TreeMap<String, String>()
        toolFiles.visit { details ->
            if (!details.directory) {
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                details.file.withInputStream { input ->
                    input.eachByte(1 << 16) { byte[] buffer, int length -> digest.update(buffer, 0, length) }
                }
                hashes['apps/' + details.relativePath.pathString] = digest.digest().encodeHex().toString()
            }
        }
        toolHashesFile.text = hashes.collect { path, hash -> "${hash}  ${path}\n" }.join('')
    }
}

// Uploads ffmpeg to this project's release named in apps.json (once), so Tool Updates can download it from here
def publishFfmpeg = tasks.register('publishFfmpeg') {
    group = 'distribution'
    description = 'Creates the ffmpeg release that Tool Updates downloads ffmpeg.exe from, if it is missing'
    dependsOn fetchFfmpeg
    def ci = providers.environmentVariable('CI')
    onlyIf { !ci.present }
    doLast {
        def gh = { List<String> args ->
            try {
                def command = (['gh'] + args + ['--repo', 'Chaiavi/acommander']).collect { it.toString() }
                def process = new ProcessBuilder(command).redirectErrorStream(true).start()
                def output = process.inputStream.text
                return [process.waitFor(), output]
            } catch (IOException e) {
                throw new GradleException("publishFfmpeg needs the GitHub CLI (gh) on the PATH: ${e.message}")
            }
        }
        if (gh(['release', 'view', ffmpegRelease])[0] == 0) {
            return
        }
        def created = gh(['release', 'create', ffmpegRelease, ffmpegExe.path, ffmpegLicense.path,
                          '--title', "FFmpeg ${ffmpegVersion}", '--latest=false',
                          '--notes', 'ffmpeg.exe (gyan.dev essentials build, GPLv3) for ACommander Tool Updates; it is too big for git.'])
        if (created[0] != 0) {
            throw new GradleException("gh release create ${ffmpegRelease} failed: ${created[1]}")
        }
    }
}

// For the developer: prints the bundled tools whose upstream (apps.json) has a newer release. Runs after `build`
// at most once a day (always when asked for by name), never in CI, and never fails the build.
def toolCheckStamp = layout.buildDirectory.file('tool-update-check.stamp')
def toolCheckRequested = gradle.startParameter.taskNames.any { it.endsWith('checkToolUpdates') }
def checkToolUpdates = tasks.register('checkToolUpdates', JavaExec) {
    group = 'verification'
    description = 'Prints the bundled tools that have a newer upstream release'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.chaiware.acommander.tools.ToolUpstreamCheck'
    workingDir = projectDir
    ignoreExitValue = true
    def ci = providers.environmentVariable('CI')
    onlyIf { !ci.present }
    onlyIf {
        def stamp = toolCheckStamp.get().asFile
        toolCheckRequested || !stamp.exists() || System.currentTimeMillis() - stamp.lastModified() > 86_400_000L
    }
    outputs.upToDateWhen { false }
    doLast {
        def stamp = toolCheckStamp.get().asFile
        stamp.parentFile.mkdirs()
        stamp.text = new Date().toString()
    }
}
tasks.named('build') { finalizedBy checkToolUpdates }

// Task to copy config and apps folders to build/libs
def copyResources = tasks.register('copyResources', Copy) {
    dependsOn fetchFfmpeg, toolHashes
    with releaseResources
    into layout.buildDirectory.dir('libs')
}

// Launch4j configuration - simplified
launch4j {
    mainClassName = 'org.chaiware.acommander.Launcher'
    classpath = ['acommander.jar']
    bundledJrePath = 'runtime'
    icon = "${projectDir}/acommander.ico"
    outfile = 'acommander.exe'
    jarTask = project.tasks.shadowJar
    headerType = "gui"
    copyConfigurable = []

    // Version info using the variable
    version = appVersion
    textVersion = appVersion
    copyright = 'Chaiware.org'
    companyName = 'Chaiware.org'
    fileDescription = 'ACommander - NC Clone'
    productName = 'ACommander'

    // JVM options
    jvmOptions = ['--enable-native-access=javafx.graphics']
}

def copyRuntime = tasks.register('copyRuntime', Sync) {
    def runtimeHome = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }.map { it.metadata.installationPath.asFile }
    from(runtimeHome)
    into(layout.buildDirectory.dir('runtime'))
}

// Built from the sources, never from dist/ or build/libs, where a run of the app leaves its own settings and logs
def distributionContents = copySpec {
    from(layout.buildDirectory.dir('launch4j')) {  // Default location for launch4j output
        include '*.exe'
    }
    from(tasks.named('shadowJar'))
    with releaseResources
    from(copyRuntime) {
        into 'runtime'
    }
}

// Mirrors the release into dist/ at the project root; a Sync, so files from older builds don't linger
def copyDist = tasks.register('copyDist', Sync) {
    dependsOn tasks.named('createExe'), fetchFfmpeg, toolHashes
    with distributionContents
    into 'dist'
    preserve { include 'acommander-v*.zip' }
}

def zipDist = tasks.register('zipDist', Zip) {
    dependsOn tasks.named('createExe'), fetchFfmpeg, toolHashes
    mustRunAfter copyDist
    with distributionContents
    archiveFileName = "acommander-v${appVersion}.zip"
    destinationDirectory = file('dist')
}

// Fails the release if the ZIP holds per-user files or lacks what the app needs to start
def verifyDistribution = tasks.register('verifyDistribution') {
    def zipFile = zipDist.flatMap { it.archiveFile }
    def templates = toolSettingsTemplates.collectEntries { live, template -> [('apps/' + live): file("apps/${template}")] }
    def allowedConfig = releaseConfigFiles.collect { 'config/' + it }
    inputs.file(zipFile)
    inputs.files(templates.values())
    doLast {
        def zip = new java.util.zip.ZipFile(zipFile.get().asFile)
        try {
            def names = Collections.list(zip.entries()).collect { it.name }
            def privateEntries = names.findAll { name ->
                (name.startsWith('config/') && name != 'config/' && !allowedConfig.contains(name)) ||
                        name.toLowerCase().endsWith('.log') ||
                        name.contains('acommander.properties') ||
                        name.startsWith('apps/copy/Log/') ||
                        name == 'apps/copy/FastCopy2.ini' ||
                        name == 'apps/extract_all/UniExtract/batch.queue' ||
                        name.startsWith('apps/extract_all/UniExtract/log/')
            }
            def required = ['acommander.exe', 'acommander.jar', 'runtime/bin/javaw.exe', 'apps/media/ffmpeg.exe',
                            'apps/media/LICENSE.txt', 'apps/tools.sha256'] + templates.keySet() + allowedConfig
            def missing = required.findAll { !names.contains(it) }
            def problems = []
            if (privateEntries) problems << "per-user files: ${privateEntries.take(20)}"
            if (missing) problems << "missing files: ${missing}"
            templates.each { String name, File template ->
                def entry = zip.getEntry(name)
                if (entry != null && zip.getInputStream(entry).bytes != template.bytes) {
                    problems << "${name} is not ${template.name}"
                }
            }
            if (problems) {
                throw new GradleException("${zipFile.get().asFile.name}: ${problems.join('; ')}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('dist') {
    dependsOn copyDist, zipDist, verifyDistribution, publishFfmpeg
    group = 'distribution'
    description = 'Creates the dist folder and a verified distribution ZIP'
}

// Fix task dependencies
tasks.named('shadowJar') { finalizedBy copyResources }
tasks.named('createExe') {
    dependsOn tasks.named('shadowJar')
    mustRunAfter copyResources
}
tasks.named('startScripts') {
    dependsOn tasks.named('shadowJar')
    dependsOn copyResources
}

tasks.named('test') {
    dependsOn fetchFfmpeg, toolHashes
    useJUnitPlatform()
    // Tests read these directly; without them a docs- or apps.json-only edit leaves `test` up-to-date (a false green).
    inputs.files('config/apps.json', 'README.md', 'docs/CODEMAP.md', toolHashesFile)
    inputs.dir('src/main/java')
    systemProperty 'acommander.appVersion', appVersionValue
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

// IntelliJ injects temporary debugger init scripts (ijJvmDebugger*.gradle) for Gradle `run`.
// Those scripts can conflict with Gradle configuration-cache deserialization across runs.
tasks.named('run') {
    dependsOn seedToolSettings, fetchFfmpeg, toolHashes
    notCompatibleWithConfigurationCache('Avoid IntelliJ debugger init-script classloader cache mismatch')
}
